<link rel="stylesheet" href="/static/common.css">
<script>
  // 저장된 설정. 서버가 쿠키로 알려 준다. 고른 적이 없으면 undefined.
  const saved = name => (document.cookie.match(new RegExp("(?:^|; )" + name + "=(\\w+)")) || [])[1];
  // 화면 모드: 저장된 설정이 있으면 그것, 없으면 Windows 설정. 그리기 전에 정해 깜빡임을 막는다.
  document.documentElement.dataset.theme = saved("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  // 끌어서 조절하는 크기(px): [최소, 최대, 방향]. settings.py의 SIZES와 같아야 한다. 저장된 크기는 CSS 변수(--이름)로 둔다.
  const SIZES = { panel: [240, 640, "x"], rows: [120, 1200, "y"], summary: [120, 1200, "y"], chart: [200, 1000, "y"] };
  for (const name in SIZES) if (saved(name)) document.documentElement.style.setProperty("--" + name, saved(name) + "px");
</script>
