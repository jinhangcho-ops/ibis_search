# Actions 탭 → build-exe → Run workflow 를 누르면 Windows용 프로그램 폴더를 만든다.
name: build-exe
on: workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: >
          pip install -r requirements.txt pyinstaller==6.22.3 "psycopg[binary]"
          "ibis-framework[athena,bigquery,clickhouse,databricks,druid,exasol,impala,materialize,mssql,mysql,oracle,postgres,risingwave,singlestoredb,snowflake,sqlite,trino]==12.0.0"
      - run: python tests.py
      - run: pyinstaller ibis_search.spec
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ibis_search-windows
          path: dist/ibis_search/
